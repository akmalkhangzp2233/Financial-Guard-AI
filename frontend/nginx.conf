server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip common text assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed build assets (Vite fingerprints filenames, so this is safe)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path -> index.html so React Router handles it
    # client-side (fixes the classic "404 on refresh at /budgets" deployment bug).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline security headers at the edge
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
