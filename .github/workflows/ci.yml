name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — install & syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile check
        working-directory: backend
        run: python -m py_compile main.py database.py models.py schemas.py auth.py ml_service.py routers/*.py
      - name: Import check (catches missing deps / circular imports)
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
        run: python -c "import main"

  frontend:
    name: Frontend — install & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: https://placeholder-for-ci-build.example.com
        run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t finguard-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t finguard-frontend:ci --build-arg VITE_API_URL=https://placeholder.example.com ./frontend
